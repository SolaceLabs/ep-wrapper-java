plugins {
    // Apply the java-library plugin for API and implementation separation.
    //id 'java-library'
    id 'java'
    id 'application'
    id 'eclipse'
    id 'idea'
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}

dependencies {
    implementation fileTree(dir: 'lib', include: '*.jar')  // EP 2.0 API Swagger codegen

    //implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.22.1'  // test for dennis' muleflow
    implementation 'org.slf4j:slf4j-api:2.+'
    //testImplementation 'org.slf4j:slf4j-log4j12:1.7.36'




    // for swagger:  (used to be runtimeOnly but now we're using some of these libraries)
    //implementation group: 'com.squareup.okhttp', name: 'okhttp', version: '2.7.5'
    //runtimeOnly group: 'io.gsonfire', name: 'gson-fire', version: '1.8.5'  // needed for runtime
    implementation group: 'io.gsonfire', name: 'gson-fire', version: '1.8.5'  // needed for runtime
    //implementation group: 'org.threeten', name: 'threetenbp', version: '1.6.0'

    // for OpenAPI Tools:
    implementation 'com.squareup.okhttp3:okhttp:4.+'
    


// aaron commenting out 2024/01/17
    //implementation group: 'org.jsonschema2pojo', name: 'jsonschema2pojo-core', version:'1.1.2'  // for Java codegen
//    implementation group: 'javax.annotation', name:'javax.annotation-api', version:'1.3.2'      // for loading any generated code


    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'
}

tasks.withType(JavaCompile).all {
    options.compilerArgs.add("-Xlint:all")
}

jar {
    archiveBaseName = rootProject.name
    archiveVersion = '0.3.0-SNAPSHOT'
    manifest {
        attributes 'Created-By': 'Aaron Lee',
                   'Implementation-Title': 'Solace Event Portal Swagger Wrapper',
                   'Implementation-Version': '0.3.0',
                   'Implementation-Date': '2024/10/14'
    }
}

